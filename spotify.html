<!doctype html>
<html>
  <head>
    <title>Our Webpage</title>
    <style>
      body {
        background: linear-gradient(
          to left,
          black,
          green,
          black,
          black,
          green,
          black
        );
      }
      h1 {
        /* transition: all 1s ease-in-out; */
        color: ghostwhite;
        text-align: center;
        font-size: 100px;
      }
      h6 {
        color: ghostwhite;
        text-align: center;
        font-size: 40px;
      }
      .Mainimage {
        transition: all 1s ease-in-out;
        width: 30%;
        margin-left: 35%;
        margin-top: 50px;
        height: 500px;
      }
      body:hover .Mainimage {
        margin-left: 35%;
        margin-top: -50px;
      }
      .Medium {
        transition: all 0.5s ease-in-out;
        border: 20px ghostwhite solid;
        background-color: ghostwhite;
        width: 400px;
        text-align: center;
      }
      .Medium img {
        width: 400px;
        margin-left: 0%;
        height: 400px;
      }
      .Medium button {
        width: 350px;
        height: 30px;
        font-size: x-large;
        background-color: ghostwhite;
        color: black;
        font-weight: bold;
        border: 0px;
      }
      .Main {
        display: flex;
        justify-content: space-evenly;
      }
      h2 {
        color: ghostwhite;
        text-align: center;
        font-size: 60px;
      }

      .Medium:hover {
        transform: translateY(-50px);
      }
      body:hover h1 {
        transform: scale(1.5);
      }
    </style>
  </head>

  <body>
    <h1>S p o t i f y</h1>
    <img
      src="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_Green.png"
